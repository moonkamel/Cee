name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Depuis supabase/functions, avec son deno.json : Deno n'utilise pas le node_modules de pnpm.
      - name: Edge Functions (typecheck Deno)
        working-directory: supabase/functions
        run: deno check --config deno.json */index.ts

  database:
    name: Base de données (migrations, seed, tests RLS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Auth et Storage sont nécessaires (schémas auth et storage) ; le reste est inutile ici.
      - name: Démarrer Supabase (migrations + seed)
        run: supabase start -x studio,imgproxy,realtime,edge-runtime,logflare,vector,supavisor,mailpit,postgres-meta

      - name: Tests pgTAP
        run: supabase test db

      # Critère de S5 : chantier créé hors ligne, retrouvé sur le serveur (vrai Supabase).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Synchronisation hors ligne contre Supabase
        run: |
          eval "$(supabase status -o env)"
          export SUPABASE_URL="$API_URL"
          export SUPABASE_ANON_KEY="${ANON_KEY:-$PUBLISHABLE_KEY}"
          test -n "$SUPABASE_ANON_KEY" || { echo "Clé publique introuvable dans supabase status"; exit 1; }
          pnpm --filter @preuvio/shared exec vitest run src/sync/supabase.integration.test.ts
